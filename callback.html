<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>AIS | TikTok Callback</title><style>body{background:#071827;color:#edfaff;font:16px system-ui;margin:0;display:grid;min-height:100vh;place-items:center}main{max-width:420px;margin:20px;padding:28px;border:1px solid #20cbd4;border-radius:20px}h1{color:#20dce4}p{line-height:1.6}</style></head><body><main><h1>AIS</h1><h2>เชื่อมต่อ TikTok</h2><p id="status">กำลังตรวจสอบการตอบกลับ...</p><p>Affiliate Intelligence Studio · Sandbox</p></main><script>const q=new URLSearchParams(location.search);const code=q.get('code'),state=q.get('state'),error=q.get('error');history.replaceState(null,'',location.pathname);document.getElementById('status').textContent=error?'TikTok ไม่อนุญาตหรือยกเลิกการเชื่อมต่อ':code&&state?'ได้รับข้อมูลตอบกลับจาก TikTok แล้ว แต่ยังไม่ได้เชื่อมต่อบัญชี: ต้องติดตั้งระบบรับ callback ฝั่ง AIS ก่อน':'หน้านี้พร้อมสำหรับทดสอบ Redirect URI แต่ยังไม่มีข้อมูลตอบกลับจาก TikTok';</script></body></html>
